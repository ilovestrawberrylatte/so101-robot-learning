<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 220" role="img" aria-labelledby="title desc"><title id="title">SmolVLA policy flow</title><desc id="desc">Camera images and task text are processed by a pretrained vision-language model. The action expert uses this context and the current robot state to produce a sequence of joint targets.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b95a1"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#424a54}.t{font-size:18.70px;font-weight:600}.s{font-size:14.30px;fill:#7c8793}.b{fill:#f2eff8;stroke:#c7bddb;stroke-width:1.3}.l{fill:none;stroke:#8b95a1;stroke-width:1.5;marker-end:url(#a)}</style><rect width="1120" height="220" fill="white"/><rect x="20" y="45" width="230" height="112" rx="7" fill="#fafafa" stroke="#d5d9de"/><text x="135" y="85" class="t" text-anchor="middle">Front + wrist images</text><text x="135" y="116" class="s" text-anchor="middle">Task instruction tokens</text><path d="M250 101h43" class="l"/><rect x="303" y="45" width="230" height="112" rx="7" class="b"/><text x="418" y="85" class="t" text-anchor="middle">Vision-language model</text><text x="418" y="116" class="s" text-anchor="middle">Pretrained visual + text features</text><path d="M533 101h43" class="l"/><rect x="586" y="45" width="230" height="112" rx="7" class="b"/><text x="701" y="85" class="t" text-anchor="middle">Action expert</text><text x="701" y="116" class="s" text-anchor="middle">Condition on context + joint state</text><path d="M816 101h43" class="l"/><rect x="869" y="45" width="230" height="112" rx="7" fill="#edf4eb" stroke="#b5c9b0"/><text x="984" y="85" class="t" text-anchor="middle">Joint-action sequence</text><text x="984" y="116" class="s" text-anchor="middle">Send targets to the same controller</text><text x="560" y="198" class="s" text-anchor="middle">Pretrained SmolVLA checkpoint → fine-tune on the 100 local demonstrations → run on the SO-101</text></svg>